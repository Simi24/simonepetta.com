name: site

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Quality gates (axe, byte budget)
        # The byte-budget gate checks the `dist` this job just built (the artifact staged for
        # deploy/preview), rather than rebuilding a second time.
        env:
          QUALITY_GATE_REUSE_DIST: '1'
        run: npm run test:quality

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload a version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler versions upload --message "PR #${{ github.event.pull_request.number }} (${{ github.sha }})" || true
          node scripts/ci/wrangler-preview.ts "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Note the skipped preview
        if: steps.upload.outputs.status == 'worker-missing'
        run: |
          {
            echo '### Preview skipped'
            echo
            echo 'The Worker does not exist on Cloudflare yet: it is created by the first `wrangler deploy` on `main`. Once this PR merges and `main` deploys once, previews on later PRs will work.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on a real upload error
        if: steps.upload.outputs.status == 'failed'
        env:
          UPLOAD_MESSAGE: ${{ steps.upload.outputs.message }}
        run: |
          echo "::error::wrangler versions upload failed: $UPLOAD_MESSAGE"
          exit 1
      - name: Comment the preview URL
        if: steps.upload.outputs.status == 'uploaded'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview-url }}
        with:
          script: |
            const marker = '<!-- site-preview-url -->';
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
