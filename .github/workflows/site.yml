name: site

# Docs and tooling files that cannot change the built site, its tests or the gates skip the run
# (SPEC.md §11). Never list `src/content/**/*.md`: that is site content. `infra/**` other than its
# README still triggers (keep the two lists identical), so the `infra` job keeps running on Terraform changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - SPEC.md
      - AGENTS.md
      - README.md
      - docs/**
      - infra/README.md
      - pipeline/README.md
      - src/integrations/scrivania/README.md
      - .ralph-gh/**
      - .ralph-gh.config
      - .github/workflows/appunti.yml
  pull_request:
    paths-ignore:
      - SPEC.md
      - AGENTS.md
      - README.md
      - docs/**
      - infra/README.md
      - pipeline/README.md
      - src/integrations/scrivania/README.md
      - .ralph-gh/**
      - .ralph-gh.config
      - .github/workflows/appunti.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (builds dist)
        # Playwright's web server builds `dist` (non-indexable) before serving it, so there is no
        # separate `npm run build` step: the quality gates below reuse that same `dist`.
        run: npm run test:browser
      - name: Writing desk (dev-only) browser check
        # SPEC.md §6.4: the desk only exists under `astro dev` — its own fresh, foreground
        # instance (see playwright.scrivania.config.ts), never reusing the preview server above.
        run: npm run test:browser-dev
      - name: Build the indexable site (main only)
        # SPEC.md §11: production is indexable and loads analytics; PR previews never are. The
        # browser tests above rebuild `dist` without the flag, so this runs after them and the
        # gates below check exactly what deploys.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SITE_INDEXABLE: 'true'
        run: npm run build
      - name: Quality gates (axe, byte budget)
        # Both gates check the `dist` this job just built (the one uploaded below for deploy and
        # preview), rather than rebuilding it.
        env:
          QUALITY_GATE_REUSE_DIST: '1'
        run: npm run test:quality
      - name: Hand the gated dist to deploy and preview
        # Only reached when every gate above passed. `deploy` and `preview` publish exactly this
        # directory; they never rebuild it (Pagefind and the notes conversions run once).
        # A per-run cache entry, not an artifact: on this plan private repos get 500 MB of
        # artifact storage and one dist weighs ~178 MB, while the Actions cache has its own
        # 10 GB per repo. `cleanup` deletes the entry at the end of the run.
        uses: actions/cache/save@v4
        with:
          path: dist
          key: dist-${{ github.run_id }}-${{ github.run_attempt }}

  infra:
    # Terraform fmt and validate only: no backend, no credentials. The deploy does not wait for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - run: scripts/ci/infra-check.sh

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore the gated dist
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore the gated dist
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Upload a version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler versions upload --message "PR #${{ github.event.pull_request.number }} (${{ github.sha }})" || true
          node scripts/ci/wrangler-preview.ts "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Require a known upload status
        # An empty or unknown status matches none of the steps below: fail instead of passing silently.
        run: node scripts/ci/require-preview-status.ts "${{ steps.upload.outputs.status }}"
      - name: Note the skipped preview
        if: steps.upload.outputs.status == 'worker-missing'
        run: |
          {
            echo '### Preview skipped'
            echo
            echo 'The Worker does not exist on Cloudflare yet: it is created by the first `wrangler deploy` on `main`. Once this PR merges and `main` deploys once, previews on later PRs will work.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on a real upload error
        if: steps.upload.outputs.status == 'failed'
        env:
          UPLOAD_MESSAGE: ${{ steps.upload.outputs.message }}
        run: |
          echo "::error::wrangler versions upload failed: $UPLOAD_MESSAGE"
          exit 1
      - name: Comment the preview URL
        if: steps.upload.outputs.status == 'uploaded'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview-url }}
        with:
          script: |
            const marker = '<!-- site-preview-url -->';
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # The gated dist travels between jobs as a per-run cache entry; once deploy and preview
  # are done nothing needs it, so the run deletes it to keep the repo's cache tidy.
  cleanup:
    needs: [build, deploy, preview]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete this run's dist cache entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "dist-${{ github.run_id }}-${{ github.run_attempt }}" -R "${{ github.repository }}" || true
